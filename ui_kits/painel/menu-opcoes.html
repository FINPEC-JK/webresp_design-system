<!-- @dsCard group="Painel do Investidor" viewport="1180x1180" name="Menu lateral — 3 opções" subtitle="Escura, papel/clara e branca (lúcida, azul), em contexto" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Menu lateral — opções · FINPEC</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { padding: 26px; background: var(--bg); }
  .stack { display: flex; flex-direction: column; gap: 26px; max-width: 1120px; margin: 0 auto; }
  .opt-head { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
  .badge { font: var(--fw-bold) 12px/1 var(--font-mono); letter-spacing: .06em; color: #fff; background: var(--primary); padding: 5px 9px; border-radius: 6px; }
  .opt-name { font: var(--fw-bold) 16px/1 var(--font-display); color: var(--ink); }
  .opt-pro { font-size: 12.5px; color: var(--muted); margin-left: auto; }
  .frame { height: 320px; border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-sm); display: grid; grid-template-columns: 250px 1fr; background: var(--surface); }
  .mini-main { display: flex; flex-direction: column; min-width: 0; }
  .mini-top { height: 56px; flex: none; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 18px; gap: 8px; }
  .mini-crumb { font-size: 12px; color: var(--muted); }
  .mini-crumb b { color: var(--ink); }
  .mini-body { padding: 18px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-content: start; background: var(--bg); flex: 1; }
  .frame .fp-sidebar { width: 250px; height: 320px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Sidebar, KpiCard } = window.FINPECDesignSystem_ccaa11;
const I = (d,sw=1.9) => () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{__html:d}}/>;
const Home = I('<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>');
const File = I('<path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M14 4v5h5"/>');
const Pen  = I('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>');
const Bank = I('<path d="m3 9 9-5 9 5"/><path d="M4 10v8M9 10v8M15 10v8M20 10v8"/><path d="M2 21h20"/>');
const Users= I('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>');

const groups = [
  { label: "Geral", items: [{ id: "vg", label: "Visão Geral", icon: <Home/> }] },
  { label: "CPRFs", items: [
    { id: "ativas", label: "Ativas", icon: <File/>, badge: "1.318", tone: "info" },
    { id: "pend", label: "Pendentes", icon: <Pen/>, badge: "14", hot: true },
  ]},
  { label: "B3 & Gestão", items: [
    { id: "b3", label: "Acompanhamento B3", icon: <Bank/>, badge: "71", tone: "info" },
    { id: "cli", label: "Clientes", icon: <Users/>, dot: true, tone: "ok" },
  ]},
];
const user = { name: "João Kraemer", role: "Administrador", initials: "JK" };

function Shell({ variant }) {
  const [active, setActive] = React.useState("ativas");
  return (
    <div className="frame">
      <Sidebar variant={variant} logoSrc="../../assets/finpec-mark.png" groups={groups} activeId={active} onNavigate={setActive} user={user} />
      <div className="mini-main">
        <div className="mini-top"><span className="mini-crumb">CPRFs / <b>Ativas</b></span></div>
        <div className="mini-body">
          <KpiCard label="Capital sob gestão" prefix="R$" value="1,84" unit="bi" tone="primary" trend={{dir:"up",label:"+8,2%"}} foot="vs. mês anterior" />
          <KpiCard label="CPRFs ativas" value="1.318" tone="info" trend={{dir:"up",label:"+42"}} foot="novas este mês" />
          <KpiCard label="Prazo crítico" value="5" tone="danger" trend={{dir:"down",label:"48h"}} foot="assinatura vence" />
        </div>
      </div>
    </div>
  );
}

function Compare() {
  const opts = [
    ["dark",  "A", "Escura · chrome quente", "Contraste forte, foco no conteúdo"],
    ["light", "B", "Papel · clara",          "Superfície creme única, leve para leitura longa"],
    ["white", "C", "Branca · lúcida (azul)",  "Fundo branco, ícones e ativo em azul — mais claro e limpo"],
  ];
  return (
    <div className="stack">
      {opts.map(([v, letter, name, pro]) => (
        <div key={v}>
          <div className="opt-head"><span className="badge">Opção {letter}</span><span className="opt-name">{name}</span><span className="opt-pro">{pro}</span></div>
          <Shell variant={v} />
        </div>
      ))}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Compare/>);
</script>
</body>
</html>
