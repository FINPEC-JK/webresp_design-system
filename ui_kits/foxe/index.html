<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FOXEN-AI · FINPEC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #cdd3cb; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script src="foxe-theme.js"></script>
<script type="text/babel" src="foxe-shared.jsx"></script>
<script type="text/babel" src="foxe-screens.jsx"></script>
<script type="text/babel">
function FoxeApp() {
  const [screen, setScreen] = React.useState("inicio");
  const [theme, setTheme] = React.useState("light");
  const [accent, setAccent] = React.useState("azul");
  const [modal, setModal] = React.useState(false);

  const vars = window.foxeTheme(theme, accent);
  React.useEffect(() => { document.body.style.background = vars["--bg"]; }, [theme, accent]);

  const meta = FOXE_META[screen] || FOXE_META.inicio;
  const nav = (id) => { setScreen(id); setModal(false); window.scrollTo(0, 0); };

  let body;
  if (screen === "inicio") body = <FoxeInicio onNav={nav} />;
  else if (screen === "contagens") body = <FoxeContagens />;
  else if (screen === "revisao") body = <FoxeRevisao onCorrect={() => setModal(true)} />;
  else if (screen === "usuarios") body = <FoxeUsuarios />;
  else body = <FoxePlaceholder title={meta[1]} />;

  const rootStyle = { display: "flex", minHeight: "100vh", fontFamily: "'Hanken Grotesk',system-ui,sans-serif", background: "var(--bg)", color: "var(--text)", ...vars };

  return (
    <div style={rootStyle}>
      <FoxeSidebar screen={screen} onNav={nav} theme={theme} accent={accent} onTheme={setTheme} onAccent={setAccent} />
      <main style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
        <FoxeTopbar crumb={meta[0]} title={meta[1]} onNew={() => nav("upload")} />
        <div style={{ padding: "26px 30px 60px", display: "flex", flexDirection: "column", gap: 22, maxWidth: 1500, width: "100%" }}>
          {window.infoBanner}
          <Stepper screen={screen} />
          {body}
        </div>
      </main>
      {modal && <FoxeModal onClose={() => setModal(false)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<FoxeApp />);
</script>
</body>
</html>
