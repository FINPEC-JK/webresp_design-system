<!-- @dsCard group="Colors" viewport="700x150" name="Ink & Text" subtitle="Warm near-black to faint — the four text tones on paper" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; }
  .row { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .demo { font: var(--fw-bold) 28px/1 var(--font-display); }
  .nm { font: var(--fw-semibold) 12px/1 var(--font-ui); color: var(--ink); }
  .hex { font: 11px/1 var(--font-mono); color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="demo" style="color:var(--ink)">Aa</div><div class="nm">ink</div><div class="hex">#1B1915</div></div>
    <div class="col"><div class="demo" style="color:var(--ink-2)">Aa</div><div class="nm">ink-2</div><div class="hex">#4A453D</div></div>
    <div class="col"><div class="demo" style="color:var(--muted)">Aa</div><div class="nm">muted</div><div class="hex">#756F63</div></div>
    <div class="col"><div class="demo" style="color:var(--faint)">Aa</div><div class="nm">faint</div><div class="hex">#A39C8E</div></div>
  </div>
</body>
</html>
