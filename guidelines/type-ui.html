<!-- @dsCard group="Type" viewport="700x190" name="UI — Hanken Grotesk" subtitle="Body, labels, controls — the everyday interface voice" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; font-family: var(--font-ui); }
  .lead { font: var(--fw-semibold) 15px/1.3 var(--font-ui); color: var(--ink); }
  .body { font: var(--fw-regular) 14px/1.5 var(--font-ui); color: var(--ink-2); max-width: 560px; margin-top: 8px; }
  .label { font: var(--fw-bold) 10.5px/1 var(--font-ui); letter-spacing: var(--ls-widest); text-transform: uppercase; color: var(--faint); margin-top: 14px; }
  .meta { font: 11px/1 var(--font-mono); color: var(--muted); margin-top: 12px; }
</style>
</head>
<body>
  <div class="lead">Resumo da operação</div>
  <div class="body">A inferência automática registra cada captação na fila. Correção, promoção de dataset e publicação exigem ação humana.</div>
  <div class="label">Seção · Indicadores</div>
  <div class="meta">Hanken Grotesk · 400 500 600 700 800</div>
</body>
</html>
