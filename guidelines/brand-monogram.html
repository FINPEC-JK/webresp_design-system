<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 0; }
  .wrap { display: flex; min-height: 180px; }
  .panel { flex: 1; display: flex; align-items: center; justify-content: center; gap: 22px; padding: 24px; }
  .light { background: var(--surface); }
  .soft { background: var(--bg); }
  .dark { background: var(--side); }
  .panel img { height: 64px; width: auto; }
  .sm { height: 32px !important; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel light"><img src="../assets/finpec-mark.png" alt=""><img class="sm" src="../assets/finpec-mark.png" alt=""></div>
    <div class="panel soft"><img src="../assets/finpec-mark.png" alt=""></div>
    <div class="panel dark"><img src="../assets/finpec-mark.png" alt=""></div>
  </div>
</body>
</html>
