<!-- @dsCard group="Colors" viewport="700x150" name="Brand Accent — Burnt Orange" subtitle="Reserved for the brand mark + attention indicators (not primary actions)" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 20px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: 8px; }
  .chip { width: 104px; height: 60px; border-radius: var(--r); border: 1px solid var(--border); }
  .nm { font: var(--fw-semibold) 12px/1 var(--font-ui); color: var(--ink); }
  .hex { font: 11px/1 var(--font-mono); color: var(--muted); margin-top: 3px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--accent)"></div><div><div class="nm">Accent</div><div class="hex">#DC4E25</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--accent-hover)"></div><div><div class="nm">Hover</div><div class="hex">#C2421C</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--accent-press)"></div><div><div class="nm">Press</div><div class="hex">#A93914</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--accent-soft)"></div><div><div class="nm">Soft</div><div class="hex">#FBEADF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--accent-ink)"></div><div><div class="nm">Ink</div><div class="hex">#8F3214</div></div></div>
  </div>
</body>
</html>
