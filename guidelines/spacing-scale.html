<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="4px base rhythm — 4 → 64" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; display: flex; flex-direction: column; gap: 9px; }
  .r { display: flex; align-items: center; gap: 12px; }
  .bar { height: 14px; background: var(--accent); border-radius: 3px; }
  .nm { font: var(--fw-semibold) 12px/1 var(--font-ui); color: var(--ink); width: 44px; }
  .v { font: 11px/1 var(--font-mono); color: var(--muted); }
</style>
</head>
<body>
  <div class="r"><span class="nm">sp-1</span><span class="bar" style="width:4px"></span><span class="v">4px</span></div>
  <div class="r"><span class="nm">sp-2</span><span class="bar" style="width:8px"></span><span class="v">8px</span></div>
  <div class="r"><span class="nm">sp-3</span><span class="bar" style="width:12px"></span><span class="v">12px</span></div>
  <div class="r"><span class="nm">sp-4</span><span class="bar" style="width:16px"></span><span class="v">16px</span></div>
  <div class="r"><span class="nm">sp-6</span><span class="bar" style="width:24px"></span><span class="v">24px</span></div>
  <div class="r"><span class="nm">sp-8</span><span class="bar" style="width:32px"></span><span class="v">32px</span></div>
  <div class="r"><span class="nm">sp-12</span><span class="bar" style="width:48px"></span><span class="v">48px</span></div>
</body>
</html>
