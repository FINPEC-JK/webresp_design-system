<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows" subtitle="Warm-tinted elevation — sm / base / lg, never cold grey" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 28px 22px; background: var(--bg); }
  .row { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .box { width: 120px; height: 70px; background: var(--surface); border-radius: var(--r-lg); }
  .nm { font: var(--fw-semibold) 12px/1 var(--font-ui); color: var(--ink); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="nm">shadow-sm</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow)"></div><div class="nm">shadow</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="nm">shadow-lg</div></div>
    <div class="col"><div class="box" style="box-shadow:var(--focus-ring);border:1px solid var(--accent)"></div><div class="nm">focus-ring</div></div>
  </div>
</body>
</html>
