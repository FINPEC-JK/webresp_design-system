<!-- @dsCard group="Type" viewport="700x180" name="Display — Schibsted Grotesk" subtitle="Titles, KPI figures, the wordmark — tight tracking, bold weights" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; }
  .big { font: var(--fw-bold) 44px/1 var(--font-display); letter-spacing: var(--ls-tight); color: var(--ink); }
  .meta { font: 11px/1 var(--font-mono); color: var(--muted); margin-top: 14px; }
  .kpi { font: var(--fw-bold) 30px/1 var(--font-display); letter-spacing: var(--ls-tight); color: var(--ink); margin-top: 12px; }
  .kpi .unit { font-size: 15px; color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
  <div class="big">Capital sob gestão</div>
  <div class="kpi">R$ 1,84 <span class="unit">bi</span></div>
  <div class="meta">Schibsted Grotesk · 400 500 600 700 800 · letter-spacing −0.02em</div>
</body>
</html>
