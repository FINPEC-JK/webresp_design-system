<!-- @dsCard group="Spacing" viewport="700x150" name="Corner Radii" subtitle="7 / 10 / 14 / 20 / pill — soft but not rounded-blobby" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; }
  .row { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 78px; height: 56px; background: var(--accent-soft); border: 1.5px solid var(--accent); }
  .nm { font: var(--fw-semibold) 12px/1 var(--font-ui); color: var(--ink); }
  .v { font: 11px/1 var(--font-mono); color: var(--muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:var(--r-sm)"></div><div class="nm">r-sm</div><div class="v">7px</div></div>
    <div class="col"><div class="box" style="border-radius:var(--r)"></div><div class="nm">r</div><div class="v">10px</div></div>
    <div class="col"><div class="box" style="border-radius:var(--r-lg)"></div><div class="nm">r-lg</div><div class="v">14px</div></div>
    <div class="col"><div class="box" style="border-radius:var(--r-xl)"></div><div class="nm">r-xl</div><div class="v">20px</div></div>
    <div class="col"><div class="box" style="border-radius:var(--r-pill)"></div><div class="nm">pill</div><div class="v">100px</div></div>
  </div>
</body>
</html>
