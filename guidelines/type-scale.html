<!-- @dsCard group="Type" viewport="700x230" name="Type Scale" subtitle="Display → label, the working ramp in context" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; display: flex; flex-direction: column; gap: 11px; }
  .r { display: flex; align-items: baseline; gap: 14px; }
  .t { color: var(--ink); }
  .px { font: 11px/1 var(--font-mono); color: var(--faint); margin-left: auto; }
</style>
</head>
<body>
  <div class="r"><span class="t" style="font:var(--fw-bold) 27px/1 var(--font-display);letter-spacing:-0.01em">Page title</span><span class="px">27 · display</span></div>
  <div class="r"><span class="t" style="font:var(--fw-semibold) 20px/1 var(--font-display)">Section heading</span><span class="px">20 · display</span></div>
  <div class="r"><span class="t" style="font:var(--fw-semibold) 15px/1 var(--font-ui)">Card title</span><span class="px">15 · ui</span></div>
  <div class="r"><span class="t" style="font:var(--fw-regular) 14px/1 var(--font-ui)">Body text — base 14px</span><span class="px">14 · ui</span></div>
  <div class="r"><span class="t" style="font:var(--fw-regular) 13px/1 var(--font-ui);color:var(--ink-2)">Table cell / secondary</span><span class="px">13 · ui</span></div>
  <div class="r"><span class="t" style="font:var(--fw-bold) 11px/1 var(--font-ui);letter-spacing:0.04em;text-transform:uppercase;color:var(--muted)">Table header</span><span class="px">11 · ui caps</span></div>
  <div class="r"><span class="t" style="font:var(--fw-bold) 10.5px/1 var(--font-ui);letter-spacing:0.13em;text-transform:uppercase;color:var(--faint)">Nav group label</span><span class="px">10.5 · ui caps</span></div>
</body>
</html>
