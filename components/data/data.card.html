<!-- @dsCard group="Components" viewport="700x560" name="Data — KPIs, Table, Chart, Pager" subtitle="KPI cards, the data grid, a sober bar chart and pagination" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { padding: 22px; } .kgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:18px; } </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { KpiCard, DataTable, BarChart, Pager, Card, Pill } = window.FINPECDesignSystem_f2149b;
const Wallet = () => <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13v4M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3M3 7h16"/><circle cx="17" cy="13" r="1.4"/></svg>;
const rows = [
  { id: "#2740", produtor: "Fazenda Santa Mônica", valor: "R$ 1.240.000", status: "Ativa", tone: "ok" },
  { id: "#2738", produtor: "Agro Cara Preta", valor: "R$ 880.500", status: "Em revisão", tone: "warn" },
  { id: "#2735", produtor: "Pasto Sul Ltda.", valor: "R$ 2.105.000", status: "Antecipação", tone: "info" },
];
function Demo() {
  const [page, setPage] = React.useState(1);
  return (
    <div>
      <div className="kgrid">
        <KpiCard label="Capital sob gestão" prefix="R$" value="1,84" unit="bi" icon={<Wallet/>} tone="primary" trend={{dir:"up",label:"+8,2%"}} foot="vs. mês anterior" />
        <KpiCard label="Pendentes de assinatura" value="14" icon={<Wallet/>} tone="warn" trend={{dir:"down",label:"5 em alerta"}} foot="prazo crítico" />
      </div>
      <Card title="Captação por mês" style={{marginBottom:18}}>
        <BarChart data={[{label:"Jul",value:62},{label:"Ago",value:48},{label:"Set",value:74},{label:"Out",value:58},{label:"Nov",value:83},{label:"Dez",value:69},{label:"Jan",value:91},{label:"Fev",value:77}]} />
      </Card>
      <Card title="CPRFs ativas" count={1318} bodyless>
        <DataTable columns={[
          { key:"id", label:"CPRF", render:r=><span className="fp-cell-id">{r.id}</span> },
          { key:"produtor", label:"Produtor", render:r=><span className="fp-cell-strong">{r.produtor}</span> },
          { key:"valor", label:"Valor", num:true, render:r=><span className="fp-cell-money">{r.valor}</span> },
          { key:"status", label:"Status", render:r=><Pill tone={r.tone} dot>{r.status}</Pill> },
        ]} rows={rows} />
        <Pager page={page} totalPages={28} label="1–3 de 1.318" onChange={setPage} />
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
