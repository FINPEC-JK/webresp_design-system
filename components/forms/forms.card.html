<!-- @dsCard group="Components" viewport="700x460" name="Forms — Fields, Inputs, Masks" subtitle="Máscaras de valor/percentual, campos, selects, checkboxes e radio cards" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { padding: 22px; } .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; } </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Field, Input, Select, Checkbox, RadioCard, MoneyInput } = window.FINPECDesignSystem_ccaa11;
function Demo() {
  const [admin, setAdmin] = React.useState(true);
  const [role, setRole] = React.useState("analista");
  return (
    <div>
      <div className="grid">
        <Field label="Valor (R$)" required hint="Preenche da direita para a esquerda."><MoneyInput mask="currency" /></Field>
        <Field label="Taxa (%)" hint="Máscara 0,00%."><MoneyInput mask="percent" defaultValue={8.2} /></Field>
        <Field label="Nome" required><Input placeholder="Nome completo" /></Field>
        <Field label="E-mail" required hint="Usado para o login."><Input type="email" placeholder="email@finpec.com" /></Field>
        <Field label="Status"><Select defaultValue="ativo"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></Select></Field>
        <Field label="Observação"><Input as="textarea" placeholder="Faltaram 4 bois…" style={{minHeight:42}} /></Field>
      </div>
      <div style={{display:"flex",gap:20,margin:"18px 0"}}>
        <Checkbox checked={admin} onChange={e=>setAdmin(e.target.checked)}>Administrador</Checkbox>
        <Checkbox checked={!admin} onChange={()=>setAdmin(!admin)}>Analista</Checkbox>
      </div>
      <div className="grid">
        <RadioCard title="Analista" desc="Revisa e corrige contagens." selected={role==="analista"} onSelect={()=>setRole("analista")} />
        <RadioCard title="Administrador" desc="Acesso total ao painel." selected={role==="admin"} onSelect={()=>setRole("admin")} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
