<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Painel FINPEC — Dashboard" description="App shell do Painel do Investidor: sidebar branca, topbar, KPIs e tabela de CPRFs" -->
<helmet>
<script src="./ds-base.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  #fp-root { height: 100vh; }
</style>
</helmet>
<div id="fp-root" style="display:grid;grid-template-columns:264px 1fr;height:100vh;overflow:hidden;background:var(--bg)">

  <!-- Sidebar (white/lucid variant) -->
  <aside style="background:#fff;color:var(--ink-2);display:flex;flex-direction:column;height:100vh;border-right:1px solid #EDEFF3">
    <div style="height:68px;flex:0 0 68px;display:flex;align-items:center;gap:11px;padding:0 20px;border-bottom:1px solid #EDEFF3">
      <img src="../../assets/finpec-mark.png" alt="" style="height:30px;width:auto" />
      <span style="font:700 16px/1 var(--font-display);letter-spacing:0.18em;color:var(--ink)">FINPEC</span>
    </div>
    <nav style="flex:1 1 auto;overflow:hidden auto;padding:12px">
      <div style="font:700 10.5px/1 var(--font-ui);letter-spacing:0.13em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px">Geral</div>
      <button style="display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--primary-soft);color:var(--primary-ink);padding:9px 12px;border-radius:7px;font:600 13.5px/1 var(--font-ui);text-align:left;position:relative">
        <span style="position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--primary);border-radius:0 3px 3px 0"></span>
        Visão Geral
      </button>
      <div style="font:700 10.5px/1 var(--font-ui);letter-spacing:0.13em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px">CPRFs</div>
      <button style="display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;color:var(--ink-2);padding:9px 12px;border-radius:7px;font:500 13.5px/1 var(--font-ui);text-align:left">Ativas<span style="font:700 11px/1.4 var(--font-ui);padding:1px 7px;border-radius:100px;background:#EEF2FA;color:var(--primary-ink)">1.318</span></button>
      <button style="display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;color:var(--ink-2);padding:9px 12px;border-radius:7px;font:500 13.5px/1 var(--font-ui);text-align:left">Pendentes<span style="font:700 11px/1.4 var(--font-ui);padding:1px 7px;border-radius:100px;background:var(--accent);color:#fff">14</span></button>
    </nav>
    <div style="flex:0 0 auto;border-top:1px solid #EDEFF3;padding:12px">
      <div style="display:flex;align-items:center;gap:11px;padding:8px">
        <span style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--font-display);color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-deep))">JK</span>
        <div><div style="color:var(--ink);font-weight:600;font-size:13px">João Kraemer</div><div style="color:var(--muted);font-size:11.5px">Administrador</div></div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div style="display:flex;flex-direction:column;height:100vh;overflow:hidden">
    <header style="height:68px;flex:0 0 68px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px">
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)"><span>Painel</span><span style="color:var(--faint)">/</span><span style="color:var(--ink);font-weight:600">Visão Geral</span></div>
      <div style="margin-left:auto">
        <x-import component-from-global-scope="FINPECDesignSystem_ccaa11.Button" variant="primary" size="sm" hint-size="120px,34px">Nova CPRF</x-import>
      </div>
    </header>

    <div style="flex:1 1 auto;overflow-y:auto;padding:28px 32px 64px">
      <div style="max-width:1320px;margin:0 auto">
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px">
          <div>
            <h1 style="font:700 27px/1.1 var(--font-display);letter-spacing:-0.01em;color:var(--ink);margin:0">Bem-vindo, João</h1>
            <p style="color:var(--muted);font-size:14px;margin-top:5px">Panorama da operação · terça-feira, 09 jun 2026</p>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
          <sc-for list="{{ kpis }}" as="kpi" hint-placeholder-count="4">
            <x-import component-from-global-scope="FINPECDesignSystem_ccaa11.KpiCard" dc-props="{{ kpi }}" hint-size="100%,150px"></x-import>
          </sc-for>
        </div>

        <div style="margin-top:16px">
          <x-import component-from-global-scope="FINPECDesignSystem_ccaa11.Card" title="CPRFs ativas" count="1.318" bodyless="{{ true }}" hint-size="100%,300px">
            <x-import component-from-global-scope="FINPECDesignSystem_ccaa11.DataTable" columns="{{ columns }}" rows="{{ rows }}" hint-size="100%,260px"></x-import>
          </x-import>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      kpis: [
        { label: 'Capital sob gestão', value: '1,84', prefix: 'R$', unit: 'bi', tone: 'primary', trend: { dir: 'up', label: '+8,2%' }, foot: 'vs. mês anterior' },
        { label: 'CPRFs ativas', value: '1.318', tone: 'info', trend: { dir: 'up', label: '+42' }, foot: 'novas este mês' },
        { label: 'Pendentes de assinatura', value: '14', tone: 'warn', trend: { dir: 'down', label: '5 em alerta' }, foot: 'prazo crítico' },
        { label: 'Aguardando registro B3', value: '71', tone: 'neutral', trend: { dir: 'up', label: '+71' }, foot: 'a registrar' },
      ],
      columns: [
        { key: 'id', label: 'CPRF', render: (r) => React.createElement('span', { className: 'fp-cell-id' }, r.id) },
        { key: 'produtor', label: 'Produtor', render: (r) => React.createElement('span', { className: 'fp-cell-strong' }, r.produtor) },
        { key: 'valor', label: 'Valor', num: true, render: (r) => React.createElement('span', { className: 'fp-cell-money' }, r.valor) },
        { key: 'status', label: 'Status', render: (r) => React.createElement(window.FINPECDesignSystem_ccaa11.Pill, { tone: r.tone, dot: true }, r.status) },
      ],
      rows: [
        { id: '#2740', produtor: 'Fazenda Santa Mônica', valor: 'R$ 1.240.000', status: 'Ativa', tone: 'ok' },
        { id: '#2739', produtor: 'Agropecuária Cara Preta', valor: 'R$ 880.500', status: 'Em revisão', tone: 'warn' },
        { id: '#2738', produtor: 'Pasto Sul Ltda.', valor: 'R$ 2.105.000', status: 'Antecipação', tone: 'info' },
        { id: '#2736', produtor: 'Fazenda Santa Helena', valor: 'R$ 540.000', status: 'Pendente assinatura', tone: 'danger' },
      ],
    };
  }
}
</script>
</body>
</html>
